<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ギターツール</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  html, body { height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    touch-action: manipulation;
  }
  .page { display: none; }
  .page.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .tabs { display: flex; border-top: 2px solid #fff; padding-bottom: env(safe-area-inset-bottom); }
  .tab {
    flex: 1; background: #000; color: #fff;
    border: none; border-radius: 0;
    min-height: 56px; font-family: inherit; font-size: 13px;
    touch-action: manipulation;
  }
  .tab.active { background: #fff; color: #000; }

  .display {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; min-height: 0;
  }
  .controls { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 12px; }
  button {
    flex: 1; background: #000; color: #fff;
    border: 2px solid #fff; border-radius: 18px;
    font-family: inherit; font-size: 17px;
    touch-action: manipulation;
  }
  button:active { background: #fff; color: #000; }
  button.on { background: #fff; color: #000; }
  .sub { min-height: 56px; }
  .step { min-height: 72px; font-size: 34px; font-weight: 300; }
  .main { min-height: 84px; font-size: 20px; }
  .main.playing { background: #fff; color: #000; }

  /* ---- メトロノーム ---- */
  .beats { display: flex; gap: 2px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 92vw; min-height: 42px; }
  .dothit { padding: 10px 6px; display: flex; align-items: center; justify-content: center; min-width: 34px; }
  .dot { width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; }
  .dot.accent { width: 22px; height: 22px; }
  .dot.on { background: #fff; }
  .bpm { font-size: clamp(52px, 20vw, 104px); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; border-bottom: 1px dashed #fff; padding-bottom: 6px; }
  .bpm-input {
    background: #000; color: #fff; border: none; border-bottom: 2px solid #fff; outline: none;
    font-family: inherit; font-size: clamp(44px, 16vw, 88px); font-weight: 200;
    width: 64vw; text-align: center; font-variant-numeric: tabular-nums;
  }
  .bpm-unit { font-size: 13px; letter-spacing: 0.1em; }
  .vol { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 40px; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: #fff; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -12px; }
  input[type="range"]::-moz-range-track { height: 2px; background: #fff; }
  input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: none; }

  /* ---- 鍵盤(共通) ---- */
  .wkey { position: absolute; top: 0; height: 100%; background: #fff; border: 1px solid #000; border-radius: 0 0 3px 3px; }
  .bkey { position: absolute; top: 0; height: 58%; background: #000; border-radius: 0 0 3px 3px; z-index: 2; }
  .kdot {
    display: none;
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 50%;
    text-align: center;
    pointer-events: none;
    line-height: 1;
    z-index: 3;
  }
  .wkey .kdot { background: #000; color: #fff; }
  .bkey .kdot { background: #fff; color: #000; }
  .wkey.lit .kdot, .wkey.press .kdot,
  .bkey.lit .kdot, .bkey.press .kdot { display: flex; align-items: center; justify-content: center; }

  /* ---- チューナー ---- */
  .tuner-top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 0; width: 100%; }
  .piano-wrap { width: 100%; padding: 0 16px; }
  .piano { position: relative; height: 92px; width: 100%; max-width: 440px; margin: 0 auto; }
  .piano .kdot { width: 24px; height: 24px; font-size: 14px; }
  .piano .wkey .kdot { bottom: 8px; }
  .piano .bkey .kdot { bottom: 6px; }
  .octRow { display: flex; gap: 6px; align-items: center; width: 100%; max-width: 440px; margin: 10px auto 0; }
  .octRow .lbl { font-size: 12px; margin-right: 4px; }
  .octBtn { flex: 1; min-height: 42px; font-size: 15px; border-radius: 10px; }
  .noteBox { border: 2px solid #fff; border-radius: 18px; min-width: 46vw; padding: 10px 24px 14px; text-align: center; }
  .noteBox.ok { background: #fff; color: #000; }
  .stringLabel { font-size: 14px; min-height: 18px; }
  .noteName { font-size: clamp(40px, 14vw, 72px); font-weight: 200; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .centsText { font-size: 15px; font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 80px; width: min(320px, 82vw); }
  .needle { position: absolute; left: 50%; bottom: 0; width: 2px; height: 68px; margin-left: -1px; background: #fff; transform-origin: bottom center; transition: transform 0.08s linear; visibility: hidden; }
  .pivot { position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; transform: translateX(-50%); }
  .hint { font-size: 13px; text-align: center; min-height: 17px; }
  .micbtn { display: flex; align-items: center; justify-content: center; }
  .micbtn .ic-on { display: none; }
  .micbtn.playing .ic-on { display: block; }
  .micbtn.playing .ic-off { display: none; }

  /* ---- 辞典 ---- */
  .dict-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    gap: 12px;
    padding: 10px 0 8px;
    overflow-y: auto;
  }
  .segRow { display: flex; gap: 10px; padding: 0 16px; }
  .segRow button { min-height: 44px; font-size: 15px; border-radius: 12px; }
  .dict-body.m-scale .only-chord, .dict-body.m-rev .only-chord { display: none; }
  .dict-body.m-chord .only-scale, .dict-body.m-rev .only-scale { display: none; }
  .dict-body.m-chord .only-rev, .dict-body.m-scale .only-rev { display: none; }
  .wrapchips { flex-wrap: wrap; }
  .fb-scroll { overflow-x: auto; padding: 0 16px; -webkit-overflow-scrolling: touch; }
  .fb-scroll svg { display: block; }
  .dictrow { display: flex; gap: 10px; padding: 0 16px; }
  .dictrow button { min-height: 46px; font-size: 15px; border-radius: 12px; }
  .vlabel { flex: 1.4; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .nameArea { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .sugCol { flex: 0 0 88px; display: flex; flex-direction: column; gap: 6px; }
  .sugHead { font-size: 11px; text-align: center; }
  .schip { min-height: 34px; font-size: 13px; border-radius: 10px; padding: 0 4px; }
  .bigName { flex: 1; text-align: center; font-weight: 250; line-height: 1.1; }
  .chordTones { text-align: center; font-size: 14px; }
  .kb2 { position: relative; height: 76px; width: 100%; }
  .kb2 .kdot { width: 15px; height: 15px; font-size: 10px; }
  .kb2 .wkey .kdot { bottom: 6px; }
  .kb2 .bkey .kdot { bottom: 4px; }
  .kb2wrap { padding: 0 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; align-items: center; -webkit-overflow-scrolling: touch; }
  .chips .clabel { font-size: 12px; flex: 0 0 auto; margin-right: 2px; }
  .chip { flex: 0 0 auto; min-height: 40px; padding: 0 14px; font-size: 15px; border-radius: 12px; }

  .sheet { position: fixed; inset: 0; background: #000; z-index: 10; display: none; flex-direction: column; }
  .sheet.open { display: flex; }
  .sheetHead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .sheetHead .ttl { flex: 1; font-size: 22px; font-weight: 250; }
  .sheetHead button { flex: 0 0 auto; min-height: 44px; padding: 0 18px; font-size: 15px; border-radius: 12px; }
  .sheetBody { flex: 1; overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
  .catTitle { font-size: 13px; margin: 14px 0 8px; }
  .rootGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .rootGrid button { min-height: 44px; font-size: 15px; border-radius: 12px; }
  .catGrid { display: flex; flex-wrap: wrap; gap: 8px; }
  .catGrid button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 12px; }

  /* ---- メモ ---- */
  .mv { display: none; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; gap: 12px; padding: 10px 0 14px; }
  .mv.on { display: flex; }
  .memoHead { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .memoHead .mtitle { flex: 1; font-size: 20px; font-weight: 250; }
  .mbtn { min-height: 46px; font-size: 15px; border-radius: 12px; padding: 0 16px; flex: 0 0 auto; }
  .addBtn { margin: 0 16px; min-height: 52px; }
  .sklist, .chordList { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
  .skrow, .ccard {
    display: flex; align-items: center; gap: 10px;
    border: 2px solid #fff; border-radius: 14px;
    min-height: 54px; padding: 0 14px;
    background: #000; color: #fff; font-family: inherit;
    text-align: left;
  }
  .skrow .nm { flex: 1; font-size: 16px; text-align: left; }
  .skrow .cnt { font-size: 13px; }
  .ccard .cn { flex: 1; font-size: 17px; text-align: left; }
  .ccard .cf { font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .ccard.playingCard { background: #fff; color: #000; }
  .secHead { font-size: 12px; margin-top: 6px; }
  .minput {
    background: #000; color: #fff;
    border: 2px solid #fff; border-radius: 12px;
    min-height: 46px; padding: 0 12px;
    font-family: inherit; font-size: 16px; flex: 1;
    outline: none;
  }
  .mtext {
    background: #000; color: #fff;
    border: 2px solid #fff; border-radius: 12px;
    min-height: 76px; padding: 10px 12px;
    font-family: inherit; font-size: 15px;
    margin: 0 16px; outline: none;
  }
  .formrow { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .flabel { font-size: 13px; width: 68px; flex: 0 0 auto; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  .ioPanel { display: none; flex-direction: column; gap: 8px; padding: 0 16px; }
  .ioPanel.on { display: flex; }
  .ioPanel .mtext { margin: 0; }

  /* ---- 練習 ---- */
  #prBody.m-pa .only-pb, #prBody.m-pa .only-pc, #prBody.m-pa .only-pd, #prBody.m-pa .only-pe { display: none; }
  #prBody.m-pb .only-pa, #prBody.m-pb .only-pc, #prBody.m-pb .only-pd, #prBody.m-pb .only-pe { display: none; }
  #prBody.m-pc .only-pa, #prBody.m-pc .only-pb, #prBody.m-pc .only-pd, #prBody.m-pc .only-pe,
  #prBody.m-pc .nameArea, #prBody.m-pc .fb-scroll,
  #prBody.m-pc .only-mic { display: none; }
  #prBody.m-pd .only-pa, #prBody.m-pd .only-pb, #prBody.m-pd .only-pc, #prBody.m-pd .only-pe,
  #prBody.m-pd .fb-scroll, #prBody.m-pd .only-mic { display: none; }
  #prBody.m-pe .only-pa, #prBody.m-pe .only-pb, #prBody.m-pe .only-pc, #prBody.m-pe .only-pd,
  #prBody.m-pe .fb-scroll { display: none; }
  #prBody .segRow button { font-size: 12px; }
  .vLive { text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; min-height: 28px; }
  .vBar { position: relative; height: 40px; margin: 0 28px; }
  .vBar .vTrack { position: absolute; left: 0; right: 0; top: 19px; height: 2px; background: #fff; }
  .vBar .vTick { position: absolute; top: 10px; width: 2px; height: 20px; background: #fff; left: 50%; margin-left: -1px; }
  .vBar .vTickS { position: absolute; top: 14px; width: 2px; height: 12px; background: #fff; margin-left: -1px; }
  .vBar .vDot { position: absolute; top: 8px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transform: translateX(-50%); left: 50%; visibility: hidden; }
  .etGrid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px; justify-content: center; }
  .etGrid button { flex: 0 0 auto; min-width: 72px; min-height: 56px; font-size: 18px; border-radius: 14px; padding: 0 14px; }
  .rcScore { font-size: 56px; font-weight: 200; text-align: center; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .rcPad { margin: 0 16px; min-height: 150px; font-size: 24px; letter-spacing: 0.2em; border-radius: 22px; }
  .pcol { display: flex; flex-direction: column; gap: 12px; }
  .flashBar { height: 8px; margin: 0 16px; background: #000; border-radius: 4px; }
  .flashBar.on { background: #fff; }
  .statRow { display: flex; justify-content: space-around; padding: 0 16px; }
  .stat { text-align: center; }
  .stat .sv { font-size: 24px; font-weight: 250; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .sl { font-size: 11px; }
  .prQ { font-size: 60px; font-weight: 200; text-align: center; line-height: 1.05; }
  .prFbk { text-align: center; font-size: 16px; min-height: 22px; }

  /* ---- テンポトレーナー ---- */
  .trow { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .tlabel { flex: 1; font-size: 15px; }
  .tstep { flex: 0 0 56px; min-height: 46px; font-size: 22px; font-weight: 300; border-radius: 12px; }
  .tval { flex: 0 0 88px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }

  /* ---- メモ拍数・本番ビュー ---- */
  .cbt { font-size: 12px; flex: 0 0 auto; }
  .liveSec { font-size: 15px; margin: 18px 0 6px; }
  .liveRow { display: flex; align-items: baseline; gap: 14px; padding: 10px 6px; border-radius: 12px; }
  .liveRow .ln { font-size: 40px; font-weight: 250; line-height: 1.1; }
  .liveRow .lf { font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .liveRow .lb { font-size: 14px; }
  .liveRow.playingCard { background: #fff; color: #000; }
</style>
</head>
<body>

<!-- ============ メトロノーム ============ -->
<div class="page" id="page-metro">
  <div class="display">
    <div class="beats" id="beats"></div>
    <div class="bpm" id="bpmView">120</div>
    <div class="bpm-unit">BPM</div>
  </div>
  <div class="controls">
    <div class="hint" id="metroHint"></div>
    <div class="row">
      <label class="vol">表<input type="range" id="volMain" min="0" max="100"></label>
      <label class="vol">細<input type="range" id="volOff" min="0" max="100"></label>
    </div>
    <div class="row">
      <button class="sub" id="beatBtn">4拍子</button>
      <button class="sub" id="subBtn">細分</button>
      <button class="sub" id="tapBtn">タップ</button>
      <button class="sub" id="trainBtn">訓練</button>
    </div>
    <div class="row">
      <button class="step" id="minusBtn" aria-label="テンポを下げる">−</button>
      <button class="step" id="plusBtn" aria-label="テンポを上げる">+</button>
    </div>
    <button class="main" id="startBtn">スタート</button>
  </div>
</div>

<!-- ============ チューナー ============ -->
<div class="page" id="page-tuner">
  <div class="tuner-top">
    <div class="piano-wrap">
      <div class="piano" id="piano"></div>
      <div class="octRow" id="octRow"><span class="lbl">オクターブ</span></div>
    </div>
    <div class="noteBox" id="noteBox">
      <div class="stringLabel" id="stringLabel"></div>
      <div class="noteName" id="noteName">—</div>
    </div>
    <div class="centsText" id="centsText">マイク停止中</div>
    <div class="meter">
      <div class="needle" id="needle"></div>
      <div class="pivot"></div>
    </div>
  </div>
  <div class="controls">
    <div class="hint" id="tunerHint"></div>
    <div class="row">
      <button class="sub" id="modeBtn">クロマチック</button>
      <button class="sub" id="refBtn">440Hz</button>
    </div>
    <button class="main micbtn" id="tunerBtn" aria-label="マイク オン/オフ">
      <svg class="ic ic-off" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      <svg class="ic ic-on" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </div>
</div>

<!-- ============ 辞典 ============ -->
<div class="page" id="page-dict">
  <div class="dict-body m-chord" id="dictBody">
    <div class="segRow">
      <button id="segChord">コード</button>
      <button id="segScale">スケール</button>
      <button id="segRev">逆引き</button>
    </div>
    <div class="fb-scroll" id="fbScroll"></div>
    <div class="dictrow only-chord">
      <button id="vPrev">◀</button>
      <div class="vlabel" id="vLabel">押さえ方 1/1</div>
      <button id="vNext">▶</button>
      <button id="playBtn">再生</button>
      <button id="chToMemo">メモ+</button>
    </div>
    <div class="chips only-chord" id="topRow"><span class="clabel">トップ</span></div>
    <div class="nameArea only-chord">
      <div class="sugCol">
        <div class="sugHead">前</div>
        <div class="sugList" id="sugPrev" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
      <div class="bigName" id="chordTitle">C</div>
      <div class="sugCol">
        <div class="sugHead">次</div>
        <div class="sugList" id="sugNext" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
    </div>
    <div class="chordTones only-chord" id="chordTones"></div>
    <div class="chips wrapchips only-chord" id="chScales"><span class="clabel">スケール</span></div>
    <div class="dictrow only-scale">
      <button id="rootTglBtn">ルート</button>
      <button id="degBtn">度数</button>
      <button id="scalePlayBtn">再生</button>
    </div>
    <div class="nameArea only-scale">
      <div class="bigName" id="scaleTitle">C メジャー</div>
    </div>
    <div class="chordTones only-scale" id="scaleTones"></div>
    <div class="chips wrapchips only-scale" id="scDia"><span class="clabel">ダイアトニック</span></div>
    <div class="dictrow only-rev">
      <button id="revClear">クリア</button>
      <button id="revToMemo">メモへ追加</button>
    </div>
    <div class="chordTones only-rev" id="revSelText">指板か鍵盤をタップして音を選択</div>
    <div class="chips wrapchips only-rev" id="revResults"><span class="clabel">候補</span></div>
    <div class="kb2wrap"><div class="kb2" id="kb2"></div></div>
    <div class="chips only-chord" id="histRow"><span class="clabel">履歴</span></div>
  </div>
</div>

<!-- ============ メモ ============ -->
<div class="page" id="page-memo">
  <div class="mv on" id="memoList">
    <div class="memoHead">
      <div class="mtitle">スケッチ</div>
      <button class="mbtn" id="skListEdit">編集</button>
      <button class="mbtn" id="skNew">新規</button>
    </div>
    <div class="sklist" id="skList"></div>
  </div>
  <div class="mv" id="memoDetail">
    <div class="memoHead">
      <button class="mbtn" id="skBack">←</button>
      <div class="mtitle" id="skName">名称</div>
    </div>
    <div class="dictrow">
      <button id="tunBtn" style="flex:2">スタンダード</button>
      <button id="capoMinus">−</button>
      <div class="vlabel" id="capoVal">カポ 0</div>
      <button id="capoPlus">＋</button>
    </div>
    <div class="dictrow">
      <button id="skPlayBtn">▶ 再生</button>
      <input class="minput" id="skBpm" inputmode="numeric" style="flex:0.6" aria-label="BPM">
      <button id="skMemoBtn">メモ</button>
      <button id="liveBtn">本番</button>
    </div>
    <textarea class="mtext" id="skMemoText" placeholder="スケッチメモ" style="display:none"></textarea>
    <div class="chordList" id="chordList"></div>

<script>
"use strict";

/* ================= 共通 ================= */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
};

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  return audioCtx.resume();
}

let wakeLock = null;
async function acquireWake() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWake() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

/* シートの開閉(Android戻るボタン対応) */
function sheetClosed(el) {
  if (el === liveSheet) {
    liveOpen = false;
    liveRowEls = [];
    if (skTimer === null) releaseWake();
  }
}
function openSheet(el) {
  el.classList.add("open");
  try { history.pushState({ gtSheet: 1 }, ""); } catch (e) {}
}
function closeSheet(el) {
  if (!el.classList.contains("open")) return;
  if (history.state && history.state.gtSheet) {
    history.back();
  } else {
    el.classList.remove("open");
    sheetClosed(el);
  }
}
window.addEventListener("popstate", () => {
  const open = document.querySelector(".sheet.open");
  if (!open) return;
  open.classList.remove("open");
  sheetClosed(open);
});

/* 2段階確認(タップ→確認表示→再タップで実行) */
const armState = new Map();
function armAction(btn, armedLabel, fn) {
  const st = armState.get(btn);
  if (st) {
    clearTimeout(st.to);
    armState.delete(btn);
    btn.textContent = st.org;
    btn.classList.remove("on");
    fn();
    return;
  }
  const org = btn.textContent;
  btn.textContent = armedLabel;
  btn.classList.add("on");
  const to = setTimeout(() => {
    btn.textContent = org;
    btn.classList.remove("on");
    armState.delete(btn);
  }, 2500);
  armState.set(btn, { org: org, to: to });
}

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

const voices = {};
async function noteOn(e, midi, el) {
  e.preventDefault();
  await ensureAudio();
  if (voices[e.pointerId]) noteOffId(e.pointerId);
  const g = audioCtx.createGain();
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
  g.connect(audioCtx.destination);
  const base = refPitch * Math.pow(2, (midi - 69) / 12);
  const parts = [[1, 1], [2, 0.45], [3, 0.22]];
  const oscs = parts.map(p => {
    const o = audioCtx.createOscillator();
    o.type = "sine";
    o.frequency.value = base * p[0];
    const pg = audioCtx.createGain();
    pg.gain.value = p[1];
    o.connect(pg).connect(g);
    o.start();
    return o;
  });
  voices[e.pointerId] = { oscs: oscs, g: g, el: el };
  el.classList.add("press");
  try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
}
function noteOff(e) { noteOffId(e.pointerId); }
function noteOffId(id) {
  const v = voices[id];
  if (!v) return;
  delete voices[id];
  const t = audioCtx.currentTime;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t);
  v.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  v.oscs.forEach(o => o.stop(t + 0.1));
  v.el.classList.remove("press");
}
function stopAllVoices() { for (const id in voices) noteOffId(id); }

function playPluck(midi, when, vol) {
  const freq = refPitch * Math.pow(2, (midi - 69) / 12);
  const sr = audioCtx.sampleRate;
  const dur = 1.7;
  const n = Math.floor(sr * dur);
  const buf = audioCtx.createBuffer(1, n, sr);
  const data = buf.getChannelData(0);
  const N = Math.max(2, Math.round(sr / freq));
  for (let i = 0; i < N; i++) data[i] = Math.random() * 2 - 1;
  for (let i = N; i < n; i++) {
    data[i] = 0.997 * 0.5 * (data[i - N] + data[i - N + 1]);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(g).connect(audioCtx.destination);
  src.start(when);
}

/* ================= タブ ================= */
const pages = {
  metro: document.getElementById("page-metro"),
  tuner: document.getElementById("page-tuner"),
  dict: document.getElementById("page-dict"),
  memo: document.getElementById("page-memo"),
  pr: document.getElementById("page-pr")
};
const tabs = {
  metro: document.getElementById("tab-metro"),
  tuner: document.getElementById("tab-tuner"),
  dict: document.getElementById("tab-dict"),
  memo: document.getElementById("tab-memo"),
  pr: document.getElementById("tab-pr")
};
function showTab(name) {
  if (!pages[name]) name = "metro";
  if (name !== "metro" && playing) stopMetro();
  if (name !== "tuner" && micOn) stopTuner();
  if (name !== "memo") stopSkPlay();
  if (name !== "pr") { stopPrMic(); rcStop(); }
  stopAllVoices();
  for (const key in pages) {
    pages[key].classList.toggle("active", key === name);
    tabs[key].classList.toggle("active", key === name);
  }
  store.set("gt.tab", name);
}
tabs.metro.addEventListener("click", () => showTab("metro"));
tabs.tuner.addEventListener("click", () => showTab("tuner"));
tabs.dict.addEventListener("click", () => showTab("dict"));
tabs.memo.addEventListener("click", () => showTab("memo"));
tabs.pr.addEventListener("click", () => showTab("pr"));

/* ================= メトロノーム ================= */
const BPM_MIN = 30, BPM_MAX = 260;
const BEAT_OPTIONS = [2, 3, 4, 5, 7, 11];

let bpm = parseFloat(store.get("gt.bpm", "120")) || 120;
let beatsPerBar = parseInt(store.get("gt.beats", "4"), 10);
if (!BEAT_OPTIONS.includes(beatsPerBar)) beatsPerBar = 4;
let subdivMode = parseInt(store.get("gt.subdiv", store.get("gt.off", "0") === "1" ? "1" : "0"), 10);
if (!(subdivMode >= 0 && subdivMode <= 4)) subdivMode = 0;
const SUB_POS = [[], [0.5], [0.25, 0.5, 0.75], [1 / 3, 2 / 3], [2 / 3]];
const SUB_LABELS = ["細分", "8分", "16分", "3連", "シャッフル"];
function loadAcc(n) {
  let s = store.get("gt.acc" + n, "");
  if (s.length !== n || /[^01]/.test(s)) s = "1" + "0".repeat(n - 1);
  return s.split("").map(c => c === "1");
}
let accents = loadAcc(beatsPerBar);
function saveAcc() { store.set("gt.acc" + beatsPerBar, accents.map(b => b ? "1" : "0").join("")); }

/* テンポトレーナー設定 */
let tr = { acc: 0, target: 140, step: 2, every: 4, mute: 0, on: 4, off: 2, prob: 30 };
try {
  const t = JSON.parse(store.get("gt.tr", "null"));
  if (t && typeof t === "object") tr = Object.assign(tr, t);
} catch (e) {}
tr.acc = tr.acc === 1 ? 1 : 0;
tr.target = Math.min(260, Math.max(30, parseInt(tr.target, 10) || 140));
tr.step = Math.min(20, Math.max(1, parseInt(tr.step, 10) || 2));
tr.every = Math.min(16, Math.max(1, parseInt(tr.every, 10) || 4));
tr.mute = [0, 1, 2].includes(tr.mute) ? tr.mute : 0;
tr.on = Math.min(16, Math.max(1, parseInt(tr.on, 10) || 4));
tr.off = Math.min(16, Math.max(1, parseInt(tr.off, 10) || 2));
tr.prob = Math.min(95, Math.max(5, parseInt(tr.prob, 10) || 30));
function saveTr() { store.set("gt.tr", JSON.stringify(tr)); }
function trainerActive() { return tr.acc === 1 || tr.mute > 0; }
let trainBpm = 0;
let barIndex = 0;
let barMuted = false;
let volMain = parseInt(store.get("gt.volMain", "100"), 10);
let volOff = parseInt(store.get("gt.volOff", "60"), 10);
if (isNaN(volMain)) volMain = 100;
if (isNaN(volOff)) volOff = 60;

let playing = false;
let editing = false;
let nextNoteTime = 0;
let currentBeat = 0;
let timerId = null;

const bpmView = document.getElementById("bpmView");
const beatsEl = document.getElementById("beats");
const startBtn = document.getElementById("startBtn");
const beatBtn = document.getElementById("beatBtn");
const subBtn = document.getElementById("subBtn");
const volMainEl = document.getElementById("volMain");
const volOffEl = document.getElementById("volOff");

function formatBpm(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function renderBpm() {
  bpmView.textContent = formatBpm(bpm);
  store.set("gt.bpm", bpm);
  if (typeof renderRcBpm === "function") renderRcBpm();
}
let dotEls = [];
function renderDots() {
  beatsEl.innerHTML = "";
  dotEls = [];
  for (let i = 0; i < beatsPerBar; i++) {
    const wrap = document.createElement("div");
    wrap.className = "dothit";
    const d = document.createElement("div");
    d.className = "dot" + (accents[i] ? " accent" : "");
    wrap.appendChild(d);
    wrap.addEventListener("click", () => {
      accents[i] = !accents[i];
      saveAcc();
      d.classList.toggle("accent", accents[i]);
    });
    beatsEl.appendChild(wrap);
    dotEls.push(d);
  }
}
function renderSub() {
  subBtn.textContent = SUB_LABELS[subdivMode];
  subBtn.classList.toggle("on", subdivMode > 0);
}
function setBpm(v) {
  if (playing && tr.acc === 1) return; /* 加速中は手動変更無効 */
  v = Math.round(v * 10) / 10;
  if (isNaN(v)) return;
  bpm = Math.min(BPM_MAX, Math.max(BPM_MIN, v));
  renderBpm();
}
function playClick(time, kind) {
  let freq, vol, dur;
  if (kind === "accent")    { freq = 1600; vol = volMain; dur = 0.05; }
  else if (kind === "main") { freq = 1000; vol = volMain; dur = 0.05; }
  else                      { freq = 2000; vol = volOff;  dur = 0.03; }
  const peak = 0.5 * (vol / 100);
  if (peak <= 0.0002) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(peak, time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.01);
}
function onBarStart() {
  if (tr.mute === 1) {
    const cyc = tr.on + tr.off;
    barMuted = (barIndex % cyc) >= tr.on;
  } else if (tr.mute === 2) {
    barMuted = Math.random() * 100 < tr.prob;
  } else {
    barMuted = false;
  }
  if (tr.acc === 1 && barIndex > 0 && barIndex % tr.every === 0) {
    if (trainBpm < tr.target) trainBpm = Math.min(tr.target, trainBpm + tr.step);
    else if (trainBpm > tr.target) trainBpm = Math.max(tr.target, trainBpm - tr.step);
    scheduleBpmView(trainBpm, nextNoteTime);
  }
  barIndex++;
}
function scheduleBpmView(v, time) {
  const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
  setTimeout(() => {
    if (playing && tr.acc === 1) bpmView.textContent = formatBpm(v);
  }, delay);
}
function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + 0.12) {
    const beat = currentBeat;
    if (beat === 0) onBarStart();
    const secPerBeat = 60 / (playing && tr.acc === 1 ? trainBpm : bpm);
    if (!barMuted) {
      playClick(nextNoteTime, accents[beat] ? "accent" : "main");
      for (const p of SUB_POS[subdivMode]) {
        playClick(nextNoteTime + secPerBeat * p, "off");
      }
    }
    scheduleVisual(beat, nextNoteTime);
    nextNoteTime += secPerBeat;
    currentBeat = (currentBeat + 1) % beatsPerBar;
  }
}
function scheduleVisual(beat, time) {
  const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
  setTimeout(() => {
    if (!playing) return;
    for (let i = 0; i < dotEls.length; i++) {
      dotEls[i].classList.toggle("on", i === beat);
    }
  }, delay);
}
async function startMetro() {
  await ensureAudio();
  playing = true;
  currentBeat = 0;
  barIndex = 0;
  barMuted = false;
  trainBpm = bpm;
  nextNoteTime = audioCtx.currentTime + 0.08;
  timerId = setInterval(scheduler, 25);
  startBtn.textContent = "ストップ";

}
function stopMetro() {
  playing = false;

}

function holdButton(el, step) {
  let delayTimer = null, repeatTimer = null;
  const change = () => setBpm(bpm + step);
  const down = () => {
    change();
    delayTimer = setTimeout(() => { repeatTimer = setInterval(change, 60); }, 400);
  };
  const up = () => { clearTimeout(delayTimer); clearInterval(repeatTimer); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);

  el.addEventListener("contextmenu", e => e.preventDefault());

let taps = [];
document.getElementById("tapBtn").addEventListener("click", () => {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length >= 2) {
    const intervals = [];
    for (let i = 1; i < taps.length; i++) intervals.push(taps[i] - taps[i - 1]);
    const recent = intervals.slice(-4);
    const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
    setBpm(Math.round(60000 / avg));
  }
  if (taps.length > 8) taps = taps.slice(-8);
});

const TUNER_MODES = ["クロマチック", "ギター", "ベース"];
const GUITAR_TARGETS = [40, 45, 50, 55, 59, 64];
const BASS_TARGETS = [28, 33, 38, 43];
const IN_TUNE_CENTS = 5;
const WHITE_PC = [0, 2, 4, 5, 7, 9, 11];
const OCT_MIN = 1, OCT_MAX = 6;

let tunerMode = parseInt(store.get("gt.tmode", "0"), 10);
if (![0, 1, 2].includes(tunerMode)) tunerMode = 0;
let refPitch = parseInt(store.get("gt.ref", "440"), 10);
if (refPitch !== 442) refPitch = 440;
let pianoOct = parseInt(store.get("gt.poct", "4"), 10);
if (isNaN(pianoOct) || pianoOct < OCT_MIN || pianoOct > OCT_MAX) pianoOct = 4;

let micOn = false;
let stream = null;
let analyser = null;
let micSource = null;
let tunerTimer = null;
let lastGoodTime = 0;
let dispCents = null;
let prevTarget = null;
const pitchBuf = new Float32Array(4096);

const noteBox = document.getElementById("noteBox");
const noteNameEl = document.getElementById("noteName");
const stringLabelEl = document.getElementById("stringLabel");
const centsTextEl = document.getElementById("centsText");

const tunerBtn = document.getElementById("tunerBtn");

function buildKeyboard(container, nOct, baseMidiFn, downOverride) {
  const keys = [], dots = [];
  const totalWhite = 7 * nOct;
  const wk = 100 / totalWhite;
  let wIndex = 0;
  const count = 12 * nOct;
  for (let i = 0; i < count; i++) {
    const pc = i % 12;
    const isWhite = WHITE_PC.includes(pc);
    const k = document.createElement("div");
    if (isWhite) {
      k.className = "wkey";
      k.style.left = (wIndex * wk) + "%";
      k.style.width = wk + "%";
      wIndex++;
    } else {
      k.className = "bkey";
      k.style.left = (wIndex * wk - wk * 0.3) + "%";
      k.style.width = (wk * 0.6) + "%";
    }
    const d = document.createElement("div");
    d.className = "kdot";
    k.appendChild(d);
    container.appendChild(k);
    keys.push(k);
    dots.push(d);
    k.addEventListener("pointerdown", (e) => {
      if (downOverride && downOverride(e, i, k)) return;
      noteOn(e, baseMidiFn(i), k);
    });
    k.addEventListener("pointerup", noteOff);
    k.addEventListener("pointercancel", noteOff);
    k.addEventListener("lostpointercapture", noteOff);
    k.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  return { keys: keys, dots: dots };
}

const tunerKb = buildKeyboard(
  document.getElementById("piano"), 1,
  (i) => (pianoOct + 1) * 12 + i
);

const octBtns = {};
(function buildOctRow() {
  const row = document.getElementById("octRow");
  for (let o = OCT_MIN; o <= OCT_MAX; o++) {

})();

}

let litKey = null;
function highlightKey(pc, octave) {
  if (litKey !== null) {
    tunerKb.keys[litKey].classList.remove("lit");
    tunerKb.dots[litKey].textContent = "";
  }
  litKey = null;
  if (pc === null) return;
  tunerKb.keys[pc].classList.add("lit");
  tunerKb.dots[pc].textContent = octave;
  litKey = pc;
}

function detectPitch(buf, sampleRate) {
  const SIZE = buf.length;
  const W = 2048;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.008) return -1;
  const minTau = Math.max(2, Math.floor(sampleRate / 1600));
  const tauMax = Math.min(Math.floor(sampleRate / 35), W - 1);
  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) {
    let sum = 0;
    for (let i = 0; i < W; i++) {
      const diff = buf[i] - buf[i + tau];
      sum += diff * diff;
    }
    d[tau] = sum;
  }
  const cmnd = new Float32Array(tauMax + 1);
  cmnd[0] = 1;
  let runningSum = 0;
  for (let tau = 1; tau <= tauMax; tau++) {
    runningSum += d[tau];
    cmnd[tau] = runningSum === 0 ? 1 : d[tau] * tau / runningSum;
  }
  let tauEstimate = -1;
  for (let tau = minTau; tau <= tauMax; tau++) {
    if (cmnd[tau] < 0.12) {
      while (tau + 1 <= tauMax && cmnd[tau + 1] < cmnd[tau]) tau++;
      tauEstimate = tau;
      break;
    }
  }
  if (tauEstimate === -1) {
    let minVal = 1, minIdx = -1;
    for (let tau = minTau; tau <= tauMax; tau++) {
      if (cmnd[tau] < minVal) { minVal = cmnd[tau]; minIdx = tau; }
    }
    if (minVal < 0.35) tauEstimate = minIdx;
    else return -1;
  }
  let betterTau = tauEstimate;
  if (tauEstimate > 1 && tauEstimate < tauMax) {
    const s0 = cmnd[tauEstimate - 1];
    const s1 = cmnd[tauEstimate];
    const s2 = cmnd[tauEstimate + 1];
    const denom = s0 + s2 - 2 * s1;
    if (denom !== 0) betterTau = tauEstimate + (s0 - s2) / (2 * denom);
  }
  return sampleRate / betterTau;
}

function processFreq(freq) {
  const midi = 69 + 12 * Math.log2(freq / refPitch);
  let target, label = "";
  if (tunerMode === 0) {
    target = Math.round(midi);
  } else {
    const targets = tunerMode === 1 ? GUITAR_TARGETS : BASS_TARGETS;
    let best = 0, bestDiff = Infinity;
    for (let i = 0; i < targets.length; i++) {
      const diff = Math.abs(midi - targets[i]);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    target = targets[best];
    label = (targets.length - best) + "弦";
  }
  let cents = (midi - target) * 100;
  if (target !== prevTarget) { dispCents = cents; prevTarget = target; }
  else { dispCents = dispCents * 0.5 + cents * 0.5; }
  const pc = ((target % 12) + 12) % 12;
  const octave = Math.floor(target / 12) - 1;
  noteNameEl.textContent = NOTE_NAMES[pc] + octave;
  stringLabelEl.textContent = label;
  const rounded = Math.round(dispCents);
  centsTextEl.textContent = (rounded > 0 ? "+" : "") + rounded + " cent";
  const clamped = Math.max(-50, Math.min(50, dispCents));
  needleEl.style.visibility = "visible";
  needleEl.style.transform = "rotate(" + (clamped * 0.9) + "deg)";
  noteBox.classList.toggle("ok", Math.abs(dispCents) <= IN_TUNE_CENTS);
  highlightKey(pc, octave);
}
function showIdle(message) {
  noteNameEl.textContent = "—";
  stringLabelEl.textContent = "";
  centsTextEl.textContent = message || "音を検出中…";
  needleEl.style.visibility = "hidden";
  noteBox.classList.remove("ok");
  highlightKey(null);
  dispCents = null;
  prevTarget = null;
}
function tunerLoop() {
  analyser.getFloatTimeDomainData(pitchBuf);
  const freq = detectPitch(pitchBuf, audioCtx.sampleRate);
  if (freq > 0) {
    lastGoodTime = performance.now();
    processFreq(freq);
  } else if (performance.now() - lastGoodTime > 700) {
    showIdle();
  }
}
async function startTuner() {
  tunerHint.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    tunerHint.textContent = "この環境ではマイクを使用できません。公開URLで開いてください。";
    return;
  }
  await ensureAudio();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    tunerHint.textContent = "マイクを使用できません。ブラウザの設定でマイクを許可してください。";
    return;
  }
  micSource = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  micSource.connect(analyser);
  micOn = true;
  lastGoodTime = 0;
  showIdle();
  tunerTimer = setInterval(tunerLoop, 60);
  tunerBtn.classList.add("playing");
  acquireWake();
}
function stopTuner() {
  micOn = false;
  clearInterval(tunerTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (micSource) { micSource.disconnect(); micSource = null; }
  analyser = null;
  tunerBtn.classList.remove("playing");
  showIdle("マイク停止中");
  releaseWake();
}
tunerBtn.addEventListener("click", () => (micOn ? stopTuner() : startTuner()));
function renderMode() { modeBtn.textContent = TUNER_MODES[tunerMode]; }
modeBtn.addEventListener("click", () => {

});

refBtn.addEventListener("click", () => {
  refPitch = refPitch === 440 ? 442 : 440;
  store.set("gt.ref", refPitch);
  renderRef();
});

const LETTERS = ["C","D","E","F","G","A","B"];
const NAT_PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const DEG_OFF = { 1:0, 2:1, 3:2, 4:3, 5:4, 6:5, 7:6, 9:1, 11:3, 13:5 };
function spellNote(rootPc, semi, deg) {
  const rootLetter = NOTE_NAMES[rootPc][0];
  const li = LETTERS.indexOf(rootLetter);
  const letter = LETTERS[(li + DEG_OFF[deg]) % 7];
  const targetPc = (rootPc + semi) % 12;
  let acc = targetPc - NAT_PC[letter];
  acc = ((acc + 6) % 12 + 12) % 12 - 6;
  let s = "";
  if (acc === 1) s = "#"; else if (acc === 2) s = "##";
  else if (acc === -1) s = "♭"; else if (acc === -2) s = "♭♭";
  return letter + s;
}

const TUNING = [40, 45, 50, 55, 59, 64];
function genVoicings(rootPc, type, topPc) {
  const chordPcs = new Set(type.iv.map(t => (rootPc + t[0]) % 12));
  const reqPcs = new Set(type.iv.filter(t => t[2]).map(t => (rootPc + t[0]) % 12));
  const results = [];
  const seen = new Set();

  function evalCombo(fr) {
    const midis = [];
    const frets = [];
    for (let s = 0; s < 6; s++) {
      if (fr[s] >= 0) {
        midis.push(TUNING[s] + fr[s]);
        if (fr[s] > 0) frets.push(fr[s]);
      }
    }
    if (midis.length < 3) return;
    if (topPc !== null && topPc !== undefined) {
      let top = midis[0];
      for (const m of midis) if (m > top) top = m;
      if (top % 12 !== topPc) return;
    }
    const pcs = new Set(midis.map(m => m % 12));
    for (const p of reqPcs) if (!pcs.has(p)) return;
    let span = 0, minF = 0;
    if (frets.length) {
      minF = Math.min.apply(null, frets);
      span = Math.max.apply(null, frets) - minF;
    }
    if (span > 3) return;
    const openCount = fr.filter(f => f === 0).length;
    let fingers = frets.length;
    let barre = false;
    if (fingers > 4) {
      if (openCount > 0) return;
      const atMin = frets.filter(f => f === minF).length;
      fingers = fingers - atMin + 1;
      barre = true;
      if (fingers > 4) return;
    }
    let first = -1, last = -1;
    for (let s = 0; s < 6; s++) if (fr[s] >= 0) { if (first < 0) first = s; last = s; }
    let inner = 0;
    for (let s = first; s <= last; s++) if (fr[s] < 0) inner++;
    if (inner > 1) return;
    const bassPc = (TUNING[first] + fr[first]) % 12;
    let cover = 0;
    for (const p of chordPcs) if (pcs.has(p)) cover++;
    let score = 0;
    score += midis.length * 10;
    if (bassPc === rootPc) score += 25;
    score += cover * 6;
    score -= inner * 12;
    score -= fingers * 2;
    score += openCount * 3;
    score -= minF * 1.2;
    if (barre) score -= 3;
    const key = fr.join(",");
    if (seen.has(key)) return;
    seen.add(key);
    results.push({ fr: fr.slice(), score: score, minF: minF, bass: first });
  }

  for (let base = 0; base <= 12; base++) {
    const maxF = base + 3;
    const opts = TUNING.map(open => {
      const arr = [-1];
      if (chordPcs.has(open % 12)) arr.push(0);
      for (let f = Math.max(1, base); f <= maxF; f++) {
        if (chordPcs.has((open + f) % 12)) arr.push(f);
      }
      return arr;
    });
    const combo = new Array(6).fill(-1);
    (function rec(s) {
      if (s === 6) { evalCombo(combo); return; }
      for (const f of opts[s]) { combo[s] = f; rec(s + 1); }
    })(0);
  }

  results.sort((a, b) => b.score - a.score);
  const picked = [];
  for (const v of results) {
    if (picked.length >= 6) break;
    let ok = true;
    for (const p of picked) {
      if (Math.abs(v.minF - p.minF) < 2 && v.bass === p.bass) { ok = false; break; }
    }
    if (ok) picked.push(v);
  }
  if (picked.length < 2) {
    for (const v of results) {
      if (picked.indexOf(v) < 0) { picked.push(v); if (picked.length >= 2) break; }
    }
  }
  return picked;
}

const FB = { NUT: 26, FW: 27.5, TOP: 16, GAP: 20, FRETS: 22 };
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function createFretboard(container) {
  const W = FB.NUT + FB.FRETS * FB.FW + 8;
  const H = 152;
  const svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H });
  for (let f = 0; f <= FB.FRETS; f++) {
    const x = FB.NUT + f * FB.FW;
    svg.appendChild(svgEl("line", { x1: x, y1: FB.TOP, x2: x, y2: FB.TOP + 5 * FB.GAP, stroke: "#fff", "stroke-width": f === 0 ? 5 : 1 }));
  }
  for (let s = 0; s < 6; s++) {
    const y = FB.TOP + s * FB.GAP;
    svg.appendChild(svgEl("line", { x1: FB.NUT, y1: y, x2: FB.NUT + FB.FRETS * FB.FW, y2: y, stroke: "#fff", "stroke-width": 1.3 }));
  }
  const midY = FB.TOP + 2.5 * FB.GAP;
  [3,5,7,9,15,17,19,21].forEach(f => {
    svg.appendChild(svgEl("circle", { cx: FB.NUT + (f - 0.5) * FB.FW, cy: midY, r: 3.5, stroke: "#fff", fill: "none", "stroke-width": 1 }));
  });
  [46, 86].forEach(y => {
    svg.appendChild(svgEl("circle", { cx: FB.NUT + 11.5 * FB.FW, cy: y, r: 3.5, stroke: "#fff", fill: "none", "stroke-width": 1 }));
  });
  [3,5,7,9,12,15,17,19,21].forEach(f => {
    const t = svgEl("text", { x: FB.NUT + (f - 0.5) * FB.FW, y: 148, "font-size": 10, fill: "#fff", "text-anchor": "middle" });
    t.textContent = f;
    svg.appendChild(t);
  });
  const dots = svgEl("g", {});
  svg.appendChild(dots);
  container.appendChild(svg);
  return { svg: svg, dots: dots };
}

function stringY(s) { return FB.TOP + (5 - s) * FB.GAP; }
function drawVoicing(v, rootPc) {
  fbDots.innerHTML = "";
  if (!v) return;
  for (let s = 0; s < 6; s++) {
    const f = v.fr[s];
    const y = stringY(s);
    if (f < 0) {
      const sz = 4.5;
      fbDots.appendChild(svgEl("line", { x1: 12 - sz, y1: y - sz, x2: 12 + sz, y2: y + sz, stroke: "#fff", "stroke-width": 1.6 }));
      fbDots.appendChild(svgEl("line", { x1: 12 - sz, y1: y + sz, x2: 12 + sz, y2: y - sz, stroke: "#fff", "stroke-width": 1.6 }));
    } else if (f === 0) {
      const isRoot = (TUNING[s] % 12) === rootPc;
      fbDots.appendChild(svgEl("circle", { cx: 12, cy: y, r: 6, stroke: "#fff", fill: "none", "stroke-width": 1.6 }));
      if (isRoot) fbDots.appendChild(svgEl("circle", { cx: 12, cy: y, r: 2.2, fill: "#fff" }));
    } else {
      const x = FB.NUT + (f - 0.5) * FB.FW;
      const isRoot = ((TUNING[s] + f) % 12) === rootPc;
      fbDots.appendChild(svgEl("circle", { cx: x, cy: y, r: 8, fill: "#fff" }));
      if (isRoot) fbDots.appendChild(svgEl("circle", { cx: x, cy: y, r: 3, fill: "#000" }));
    }
  }
  const sc = document.getElementById("fbScroll");
  if (v.minF > 9) sc.scrollLeft = FB.NUT + (v.minF - 2) * FB.FW;
  else sc.scrollLeft = 0;
}

function fillSug(el, list) {
  el.innerHTML = "";
  list.forEach(sg => {
    const nr = (curRoot + sg[0]) % 12;
    const nt = sg[1];
    const b = document.createElement("button");
    b.className = "schip";
    b.textContent = chordName(nr, nt);

function showChord(r, t, addHist) {
  if (addHist === undefined) addHist = true;
  const tp = TYPE_BY_ID[t];
  if (!tp) return;
  curRoot = r; curType = t;
  store.set("gt.lastChord", JSON.stringify({ r: r, t: t }));

  const name = chordName(r, t);
  chordTitleEl.textContent = name + " ▾";
  chordTitleEl.style.fontSize = (name.length > 8 ? 24 : (name.length > 5 ? 32 : 44)) + "px";
  chordTonesEl.textContent = tp.iv.map(iv => spellNote(r, iv[0], iv[1])).join("  ");

  topSel = null;
  curVoicings = genVoicings(r, tp, null);
  vIdx = 0;
  renderVoicing();
  renderTopRow(tp);

  chordMidis = [];
  const indices = [];
  tp.iv.forEach(iv => {
    let idx = r + iv[0];
    if (idx > 23) idx -= 12;
    indices.push(idx);
    chordMidis.push(48 + idx);
  });
  lightKb2(indices, (i) => (i === r ? "R" : ""));

  const sug = SUGGEST[tp.fam] || { p: [], n: [] };
  fillSug(document.getElementById("sugPrev"), sug.p);
  fillSug(document.getElementById("sugNext"), sug.n);

  const scRow = document.getElementById("chScales");
  scRow.innerHTML = '<span class="clabel">スケール</span>';
  scalesForChord(r, tp).forEach(sc => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = NOTE_NAMES[r] + " " + sc.l;
    b.addEventListener("click", () => { setDictMode("scale"); showScale(r, sc.id); });
    scRow.appendChild(b);
  });

  document.getElementById("sheetTitle").textContent = name;
  renderRootGrid();
  if (addHist) pushHist(r, t);
}
function renderVoicing() {
  const v = curVoicings[vIdx] || null;
  drawVoicing(v, curRoot);
  vLabelEl.textContent = v ? "押さえ方 " + (vIdx + 1) + "/" + curVoicings.length : "フォームなし";
}
function renderTopRow(tp) {
  const row = document.getElementById("topRow");
  row.innerHTML = '<span class="clabel">トップ</span>';
  const none = document.createElement("button");
  none.className = "chip";
  none.textContent = "指定なし";
  none.classList.toggle("on", topSel === null);
  none.addEventListener("click", () => setTopSel(null));
  row.appendChild(none);
  tp.iv.forEach(iv => {
    const pc = (curRoot + iv[0]) % 12;
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = spellNote(curRoot, iv[0], iv[1]);
    b.classList.toggle("on", topSel === pc);
    b.addEventListener("click", () => setTopSel(pc));
    row.appendChild(b);
  });
}
function setTopSel(pc) {
  topSel = pc;
  const tp = TYPE_BY_ID[curType];
  curVoicings = genVoicings(curRoot, tp, topSel);
  vIdx = 0;
  renderVoicing();
  renderTopRow(tp);
}

function scalesForChord(rootPc, tp) {
  const cs = tp.iv.map(v => (rootPc + v[0]) % 12);
  const out = [];
  for (const sc of SCALES) {
    if (sc.id === "chromatic") continue;
    const pcs = new Set(sc.iv.map(v => (rootPc + v[0]) % 12));
    if (cs.every(p => pcs.has(p))) out.push(sc);
  }
  out.sort((a, b) => (a.iv.length - b.iv.length) || (SCALES.indexOf(a) - SCALES.indexOf(b)));
  return out.slice(0, 8);
}
const DIA_SEVENTHS = ["maj7", "7", "m7", "m7b5", "mMaj7", "dim7", "maj7#5", "7#5"];
const DIA_TRIADS = ["", "m", "dim", "aug"];
function diatonicChords(rootPc, sc) {
  const pcs = new Set(sc.iv.map(v => (rootPc + v[0]) % 12));
  const out = [];
  sc.iv.forEach(v => {
    if (v[1] === null) return;
    const r2 = (rootPc + v[0]) % 12;
    let hit = null;
    for (const id of DIA_SEVENTHS) {
      const tp = TYPE_BY_ID[id];
      if (tp.iv.every(w => pcs.has((r2 + w[0]) % 12))) { hit = id; break; }
    }
    if (hit === null) {
      for (const id of DIA_TRIADS) {
        const tp = TYPE_BY_ID[id];
        if (tp.iv.every(w => pcs.has((r2 + w[0]) % 12))) { hit = id; break; }
      }
    }
    if (hit !== null) out.push({ deg: degLabel(v[0], v[1]), r: r2, t: hit });
  });
  return out;
}

function drawScale(r, sc) {
  fbDots.innerHTML = "";
  const pcs = new Set(sc.iv.map(v => (r + v[0]) % 12));
  const useDeg = degShow && sc.id !== "chromatic";

  if (useDeg) {
    sc.iv.forEach(v => { degOf[(r + v[0]) % 12] = (v[0] === 0 ? "R" : degLabel(v[0], v[1])); });
  }
  function put(x, y, pc) {
    const isR = pc === r;
    if (useDeg) {
      fbDots.appendChild(svgEl("circle", { cx: x, cy: y, r: 9, fill: "#fff" }));
      const t = svgEl("text", { x: x, y: y + 3.2, "font-size": isR ? 10 : 8.5, fill: "#000", "text-anchor": "middle" });

function revMidis() {
  const arr = [];
  for (let s = 0; s < 6; s++) if (revStr[s] !== null) arr.push(TUNING[s] + revStr[s]);
  revKeys.forEach(i => arr.push(48 + i));
  arr.sort((a, b) => a - b);
  return arr;
}
function drawRevFret() {
  fbDots.innerHTML = "";
  for (let s = 0; s < 6; s++) {
    const f = revStr[s];
    if (f === null) continue;
    const y = stringY(s);
    if (f === 0) {
      fbDots.appendChild(svgEl("circle", { cx: 12, cy: y, r: 6, stroke: "#fff", fill: "none", "stroke-width": 1.6 }));
    } else {
      fbDots.appendChild(svgEl("circle", { cx: FB.NUT + (f - 0.5) * FB.FW, cy: y, r: 8, fill: "#fff" }));
    }
  }
}
function identifyChords(midis) {
  if (midis.length < 2) return [];
  const inPcs = new Set(midis.map(m => m % 12));
  const bassPc = midis[0] % 12;
  const out = [];
  for (let r = 0; r < 12; r++) {
    if (!inPcs.has(r)) continue;
    for (const tp of CHORD_TYPES) {
      const set = new Set(tp.iv.map(v => (r + v[0]) % 12));
      const req = tp.iv.filter(v => v[2]).map(v => (r + v[0]) % 12);
      let ok = true;
      for (const p of req) if (!inPcs.has(p)) { ok = false; break; }
      if (!ok) continue;
      let extra = false;
      inPcs.forEach(p => { if (!set.has(p)) extra = true; });
      if (extra) continue;
      let missOpt = 0;
      set.forEach(p => { if (!inPcs.has(p)) missOpt++; });
      let score = 100 - missOpt * 6 - set.size;
      if (inPcs.size === set.size) score += 20;
      if (bassPc === r) score += 8;
      out.push({ r: r, t: tp.id, score: score, slash: bassPc !== r ? bassPc : null });
    }
  }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, 10);
}
function renderRev() {
  drawRevFret();
  const keyIdx = [];
  revKeys.forEach(i => keyIdx.push(i));
  lightKb2(keyIdx, () => "");
  const midis = revMidis();
  if (midis.length === 0) {
    revSelTextEl.textContent = "指板か鍵盤をタップして音を選択";
  } else {
    revSelTextEl.textContent = "選択: " + midis.map(m => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1)).join(" ");
  }
  revResultsEl.innerHTML = '<span class="clabel">候補</span>';
  if (midis.length < 2) {
    if (midis.length === 1) {
      const sp = document.createElement("span");
      sp.className = "clabel";
      sp.textContent = "2音以上で判定します";
      revResultsEl.appendChild(sp);
    }
    return;
  }
  const cands = identifyChords(midis);
  if (!cands.length) {
    const sp = document.createElement("span");
    sp.className = "clabel";
    sp.textContent = "該当なし";
    revResultsEl.appendChild(sp);
    return;
  }
  cands.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = chordName(c.r, c.t) + (c.slash !== null ? "/" + NOTE_NAMES[c.slash] : "");
    b.addEventListener("click", () => {
      setDictMode("chord");
      showChord(c.r, c.t);
    });
    revResultsEl.appendChild(b);
  });
}

  await ensureAudio();

  if (dictMode !== "rev") return;
  const rect = fbSvg.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (y < FB.TOP - 12 || y > FB.TOP + 5 * FB.GAP + 12) return;
  let row = Math.round((y - FB.TOP) / FB.GAP);
  row = Math.max(0, Math.min(5, row));
  const s = 5 - row;
  if (x < FB.NUT) {
    revStr[s] = (revStr[s] === 0) ? null : 0;
    if (revStr[s] === 0) revBlip(TUNING[s]);
  } else {
    let f = Math.floor((x - FB.NUT) / FB.FW) + 1;
    f = Math.max(1, Math.min(FB.FRETS, f));
    revStr[s] = (revStr[s] === f) ? null : f;
    if (revStr[s] === f) revBlip(TUNING[s] + f);
  }
  renderRev();
});

/* ---- 進行の自動再生 ---- */
function stopSkPlay() {
  if (skTimer !== null) { clearTimeout(skTimer); skTimer = null; }
  if (playCardIdx >= 0) {
    if (chordCardEls[playCardIdx]) chordCardEls[playCardIdx].classList.remove("playingCard");
    if (liveRowEls[playCardIdx]) liveRowEls[playCardIdx].classList.remove("playingCard");
  }
  playCardIdx = -1;
  skPlayBtn.textContent = "▶ 再生";
  skPlayBtn.classList.remove("playing");
  renderLivePlayBtn();
  if (!liveOpen) releaseWake();
}
async function startSkPlay() {
  if (!curSk || !curSk.chords.length) return;
  await ensureAudio();
  acquireWake();
  skPlayBtn.textContent = "■ 停止";
  skPlayBtn.classList.add("playing");
  playCardIdx = -1;
  const step = () => {
    if (playCardIdx >= 0) {
      if (chordCardEls[playCardIdx]) chordCardEls[playCardIdx].classList.remove("playingCard");
      if (liveRowEls[playCardIdx]) liveRowEls[playCardIdx].classList.remove("playingCard");
    }
    playCardIdx++;
    if (playCardIdx >= curSk.chords.length) { stopSkPlay(); return; }
    const c = curSk.chords[playCardIdx];
    const card = chordCardEls[playCardIdx];
    if (card) {
      card.classList.add("playingCard");
      card.scrollIntoView({ block: "nearest" });
    }
    if (liveOpen && liveRowEls[playCardIdx]) {
      liveRowEls[playCardIdx].classList.add("playingCard");
      liveRowEls[playCardIdx].scrollIntoView({ block: "center" });
    }
    strum(curSk, c.fr, 0.45);
    skTimer = setTimeout(step, (c.bt || 4) * 60000 / (curSk.bpm || 100));
  };
  step();
  renderLivePlayBtn();
}
skPlayBtn.addEventListener("click", () => (skTimer !== null ? stopSkPlay() : startSkPlay()));

function redrawEdit() {
  memoFb.dots.innerHTML = "";
  let minF = 99;
  for (let s = 0; s < 6; s++) {
    const f = editFr[s];
    const y = stringY(s);
    if (f < 0) {
      const sz = 4.5;
      memoFb.dots.appendChild(svgEl("line", { x1: 12 - sz, y1: y - sz, x2: 12 + sz, y2: y + sz, stroke: "#fff", "stroke-width": 1.6 }));
      memoFb.dots.appendChild(svgEl("line", { x1: 12 - sz, y1: y + sz, x2: 12 + sz, y2: y - sz, stroke: "#fff", "stroke-width": 1.6 }));
    } else if (f === 0) {
      memoFb.dots.appendChild(svgEl("circle", { cx: 12, cy: y, r: 6, stroke: "#fff", fill: "none", "stroke-width": 1.6 }));
    } else {
      memoFb.dots.appendChild(svgEl("circle", { cx: FB.NUT + (f - 0.5) * FB.FW, cy: y, r: 8, fill: "#fff" }));
      if (f < minF) minF = f;
    }
  }
  const sc = document.getElementById("mFbScroll");
  if (minF !== 99 && minF > 9) sc.scrollLeft = FB.NUT + (minF - 2) * FB.FW;
  renderEdCands();
}
function renderEdCands() {
  edCandsEl.innerHTML = '<span class="clabel">候補</span>';
  edShapeHintEl.textContent = "";
  const midis = chordMidisOf(curSk, editFr);
  if (midis.length < 2) return;
  const cands = identifyChords(midis).slice(0, 6);
  cands.forEach(c => {
    const label = chordName(c.r, c.t) + (c.slash !== null ? "/" + NOTE_NAMES[c.slash] : "");
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = label;
    b.addEventListener("click", () => { edNameEl.value = label; });
    edCandsEl.appendChild(b);
  });
  if (curSk.capo > 0) {
    const tm = tunOf(curSk).m;
    const shapeMidis = [];
    for (let s = 0; s < 6; s++) if (editFr[s] >= 0) shapeMidis.push(tm[s] + editFr[s]);
    shapeMidis.sort((a, b) => a - b);
    const sc = identifyChords(shapeMidis);
    if (sc.length) {
      edShapeHintEl.textContent = "カポ0換算フォーム: " + chordName(sc[0].r, sc[0].t) + (sc[0].slash !== null ? "/" + NOTE_NAMES[sc[0].slash] : "");
    }
  }
}
memoFb.svg.addEventListener("click", (e) => {
  if (!pages.memo.classList.contains("active") || memoView !== "edit") return;
  const rect = memoFb.svg.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (y < FB.TOP - 12 || y > FB.TOP + 5 * FB.GAP + 12) return;
  let row = Math.round((y - FB.TOP) / FB.GAP);
  row = Math.max(0, Math.min(5, row));
  const s = 5 - row;
  if (x < FB.NUT) {
    editFr[s] = (editFr[s] === 0) ? -1 : 0;
    if (editFr[s] === 0) revBlip(tunOf(curSk).m[s] + curSk.capo);
  } else {
    let f = Math.floor((x - FB.NUT) / FB.FW) + 1;
    f = Math.max(1, Math.min(FB.FRETS, f));
    editFr[s] = (editFr[s] === f) ? -1 : f;
    if (editFr[s] === f) revBlip(tunOf(curSk).m[s] + curSk.capo + f);

/* ---- TSVエクスポート/インポート ---- */
function buildTsv(sk) {
  let out = "スケッチ\t" + sk.name + "\tカポ\t" + sk.capo + "\tチューニング\t" + tunOf(sk).l + "\n";
  if (sk.memo) out += "メモ\t" + sk.memo.replace(/\n/g, " ") + "\n";
  out += "セクション\tコード名\t6弦\t5弦\t4弦\t3弦\t2弦\t1弦\t拍\tメモ\n";
  sk.chords.forEach(c => {
    out += (c.sec || "") + "\t" + (c.name || "") + "\t" + c.fr.map(f => f < 0 ? "x" : f).join("\t") + "\t" + (c.bt || 4) + "\t" + (c.memo || "") + "\n";
  });
  return out;
}
function hideIo() {
  ioPanel.classList.remove("on");
  ioStatus.textContent = "";
  ioText.value = "";
  ioMode = "";
  const fr = document.getElementById("ioFmtRow");
  if (fr) { fr.style.display = "none"; document.getElementById("ioScopeRow").style.display = "none"; }
}
function mdEsc(s) { return String(s || "").replace(/\|/g, "／").replace(/\n/g, " "); }
function buildMd(sk) {
  let out = "## " + mdEsc(sk.name) + " (カポ" + sk.capo + " / " + tunOf(sk).l + " / BPM" + (sk.bpm || 100) + ")\n";
  if (sk.memo) out += "メモ: " + mdEsc(sk.memo) + "\n";
  out += "\n| セクション | コード | 6弦 | 5弦 | 4弦 | 3弦 | 2弦 | 1弦 | 拍 | メモ |\n";
  out += "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n";
  sk.chords.forEach(c => {
    out += "| " + mdEsc(c.sec) + " | " + mdEsc(c.name) + " | " + c.fr.map(f => f < 0 ? "x" : f).join(" | ") + " | " + (c.bt || 4) + " | " + mdEsc(c.memo) + " |\n";
  });
  return out;
}
let ioFmt = "tsv", ioScope = "one";
function renderIoSel() {
  document.getElementById("ioFmtTsv").classList.toggle("on", ioFmt === "tsv");
  document.getElementById("ioFmtMd").classList.toggle("on", ioFmt === "md");

  const text = list.map(sk => (ioFmt === "md" ? buildMd(sk) : buildTsv(sk))).join("\n");
  ioText.value = text;

  } catch (e) {

  }

function z2h(s) {
  return String(s).replace(/[０-９]/g, ch => "０１２３４５６７８９".indexOf(ch));
}
function parseFretCell(s) {
  s = z2h(s).trim().toLowerCase();
  if (s === "" || s === "x" || s === "×" || s === "-" || s === "ｘ") return -1;
  const n = parseInt(s, 10);
  if (isNaN(n) || n < 0 || n > 24) return NaN;
  return n;
}
document.getElementById("ioRun").addEventListener("click", () => {
  const lines = ioText.value.split(/\r?\n/);
  let added = 0, skipped = 0;
  lines.forEach(line => {
    if (!line.trim()) return;
    const cols = line.split("\t");
    if (cols[0] === "スケッチ") {
      if (cols[1]) { curSk.name = cols[1]; }
      const cp = parseInt(z2h(cols[3] || ""), 10);
      if (!isNaN(cp) && cp >= 0 && cp <= 9) curSk.capo = cp;
      const tn = TUNINGS.find(t => t.l === (cols[5] || "").trim());
      if (tn) curSk.tun = tn.id;
      return;
    }
    if (cols[0] === "メモ" && cols.length >= 2 && cols.length <= 3) { curSk.memo = cols[1]; return; }
    if (cols[0] === "セクション" && cols[1] === "コード名") return;
    if (cols.length < 8) { skipped++; return; }
    const fr = [];
    let bad = false;
    for (let i = 2; i <= 7; i++) {
      const v = parseFretCell(cols[i]);
      if (isNaN(v)) { bad = true; break; }
      fr.push(v);
    }
    if (bad) { skipped++; return; }
    let bt = 4, cmemo = "";
    if (cols.length >= 10) {
      const b = parseInt(z2h(cols[8]), 10);

    curSk.chords.push({ sec: (cols[0] || "").trim(), name: (cols[1] || "").trim(), fr: fr, bt: bt, memo: cmemo });

  });

const NAT_DEG_SEMI = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };
function degLabel(semi, deg) {
  const d = semi - NAT_DEG_SEMI[deg];
  let p = "";
  if (d === -1) p = "♭"; else if (d === 1) p = "♯";
  else if (d === -2) p = "♭♭"; else if (d === 2) p = "♯♯";
  return p + deg;
}
async function nextQuestion() {

  if (opts.length > 1 && pick[0] === pbQSemi) {

  }

/* ---- 判定 ---- */
function onNoteEvent(pc) {
  if (prMode === "a") {
    if (prScalePcs().has(pc)) {
      paIn++;
      paStreak++;
      if (paStreak > paBest) { paBest = paStreak; store.set("gt.paBest", paBest); }
      flashPc(pc, true);
    } else {
      paOut++;
      paStreak = 0;
      flashWarn();
      flashPc(pc, false);
    }
    renderPaStats();
  } else {
    if (pbLock || pbQSemi < 0) return;
    const target = (curScaleRoot + pbQSemi) % 12;
    pbTotal++;
    if (pc === target) {
      pbCorrect++;
      pbStreak++;
      if (pbStreak > pbBest) { pbBest = pbStreak; store.set("gt.pbBest", pbBest); }
      prFbkEl.textContent = "○ 正解";
      flashPc(target, true);
    } else {
      pbStreak = 0;
      prFbkEl.textContent = "× 正解は " + spellNote(curScaleRoot, pbQSemi, pbQDeg);
      flashPc(target, true);
    }
    renderPbStats();
    pbLock = true;
    setTimeout(() => { pbLock = false; nextQuestion(); }, 1000);
  }
}
function prLoop() {
  prAnalyser.getFloatTimeDomainData(prBuf);
  const f = detectPitch(prBuf, audioCtx.sampleRate);
  if (prMode === "e") { voFrame(f); return; }
  const now = performance.now();
  if (f > 0) {
    const midi = 69 + 12 * Math.log2(f / refPitch);
    const pc = ((Math.round(midi) % 12) + 12) % 12;
    prLastVoiceTime = now;
    if (pc === prCandPc) prCandCount++;
    else { prCandPc = pc; prCandCount = 1; }
    if (prCandCount >= 2 && pc !== prHeldPc) {
      prHeldPc = pc;
      onNoteEvent(pc);
    }
  } else if (now - prLastVoiceTime > 350) {
    prHeldPc = -1;
    prCandPc = -1;
    prCandCount = 0;
  }
}

async function startPrMic() {
  prHintEl.textContent = "";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    prHintEl.textContent = "この環境ではマイクを使用できません。公開URLで開いてください。";
    return;
  }
  await ensureAudio();
  try {
    prStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    prHintEl.textContent = "マイクを使用できません。ブラウザの設定でマイクを許可してください。";
    return;
  }
  prSource = audioCtx.createMediaStreamSource(prStream);
  prAnalyser = audioCtx.createAnalyser();
  prAnalyser.fftSize = 4096;
  prSource.connect(prAnalyser);
  prMicOn = true;
  prHeldPc = -1; prCandPc = -1; prCandCount = 0; prLastVoiceTime = 0;
  prTimer = setInterval(prLoop, 60);
  prMicBtn.classList.add("playing");
  acquireWake();
  if (prMode === "b") nextQuestion();
  if (prMode === "e") {
    if (voAsked) {
      voDeadline = performance.now() + 6000;
      voHoldStart = 0;
    }
    prRefresh();

}
function stopPrMic() {
  if (!prMicOn && !prStream) return;
  prMicOn = false;
  clearInterval(prTimer);
  if (prStream) { prStream.getTracks().forEach(t => t.stop()); prStream = null; }
  if (prSource) { prSource.disconnect(); prSource = null; }
  prAnalyser = null;
  prMicBtn.classList.remove("playing");
  releaseWake();
}
