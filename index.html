let rcOn = false;
let rcTargetBack = store.get("gt.rcback", "0") === "1";
let rcTimer = null;
let rcNextBeat = 0;
let rcBeat = 0;
let rcBarNum = 0;
let rcMuted = false;
let rcBpmCur = 0;
let rcTargets = [];
let rcGood = 0, rcOk = 0, rcMiss = 0;
let rcRoll = [];
let rcDevs = [];

const rcScoreEl = document.getElementById("rcScore");
const rcSubEl = document.getElementById("rcSub");
const rcFbkEl = document.getElementById("rcFbk");
const rcStartBtn = document.getElementById("rcStart");
const rcTgtBtn = document.getElementById("rcTgtBtn");
const rcBpmV = document.getElementById("rcBpmV");
const rcPad = document.getElementById("rcPad");

const rcDotEls = [];
(function buildRcDots() {
  const box = document.getElementById("rcDots");
  for (let i = 0; i < 4; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === 0 ? " accent" : "");
    box.appendChild(d);
    rcDotEls.push(d);
  }
})();

function outLat() {
  if (!audioCtx) return 0;
  return audioCtx.outputLatency || audioCtx.baseLatency || 0;
}
function fmtMs(ms) { return (ms > 0 ? "+" : "") + ms + "ms"; }
function renderRcBpm() {
  rcBpmV.textContent = formatBpm(rcOn && tr.acc === 1 ? rcBpmCur : bpm);
}
function renderRcTgt() {
  rcTgtBtn.textContent = rcTargetBack ? "裏拍" : "表拍";
  rcTgtBtn.classList.toggle("on", rcTargetBack);
}
function rcFbkSet(t) { rcFbkEl.textContent = t; }
function trimRoll() { if (rcRoll.length > 16) rcRoll.shift(); }
function renderRc() {
  if (rcRoll.length) {
    const hits = rcRoll.reduce((a, b) => a + b, 0);
    rcScoreEl.textContent = Math.round(100 * hits / rcRoll.length) + "%";
  } else {
    rcScoreEl.textContent = "—";
  }
  let sub = "良 " + rcGood + " ・ 可 " + rcOk + " ・ ミス " + rcMiss;
  if (rcDevs.length) {
    const avg = Math.round(rcDevs.reduce((a, b) => a + b, 0) / rcDevs.length);
    sub += " ・ 平均 " + fmtMs(avg) + (avg > 8 ? "(遅れ)" : (avg < -8 ? "(先走り)" : ""));
  }
  rcSubEl.textContent = sub;
}
function rcScheduleDot(beat, time) {
  const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
  setTimeout(() => {
    if (!rcOn) return;
    for (let i = 0; i < 4; i++) rcDotEls[i].classList.toggle("on", i === beat);
  }, delay);
}
function rcScheduleBpm(v, time) {
  const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
  setTimeout(() => { if (rcOn && tr.acc === 1) rcBpmV.textContent = formatBpm(v); }, delay);
}
function rcBarStart() {
  if (rcBarNum >= 1) {
    if (tr.mute === 1) {
      const cyc = tr.on + tr.off;
      rcMuted = ((rcBarNum - 1) % cyc) >= tr.on;
    } else if (tr.mute === 2) {
      rcMuted = Math.random() * 100 < tr.prob;
    } else {
      rcMuted = false;
    }
    if (tr.acc === 1 && (rcBarNum - 1) > 0 && (rcBarNum - 1) % tr.every === 0) {
      if (rcBpmCur < tr.target) rcBpmCur = Math.min(tr.target, rcBpmCur + tr.step);
      else if (rcBpmCur > tr.target) rcBpmCur = Math.max(tr.target, rcBpmCur - tr.step);
      rcScheduleBpm(rcBpmCur, rcNextBeat);
    }
  } else {
    rcMuted = false;
  }
  if (rcBarNum === 1) rcFbkSet("");
  rcBarNum++;
}
function rcLoop() {
  const now = audioCtx.currentTime;
  while (rcNextBeat < now + 0.12) {
    if (rcBeat === 0) rcBarStart();
    const spb = 60 / rcBpmCur;
    if (!rcMuted) playClick(rcNextBeat, rcBeat === 0 ? "accent" : "main");
    if (rcBarNum >= 2) { /* カウントイン(1小節目)は判定なし */
      const t = rcTargetBack ? rcNextBeat + spb / 2 : rcNextBeat;
      rcTargets.push({ t: t, judged: false });
    }
    rcScheduleDot(rcBeat, rcNextBeat);
    rcNextBeat += spb;
    rcBeat = (rcBeat + 1) % 4;
  }
  const lat = outLat();
  let changed = false;
  for (const tg of rcTargets) {
    if (!tg.judged && now > tg.t + lat + 0.13) {
      tg.judged = true;
      rcMiss++;
      rcRoll.push(0);
      trimRoll();
      rcFbkSet("ミス(見逃し)");
      changed = true;
    }
  }
  if (changed) renderRc();
  rcTargets = rcTargets.filter(tg => !(tg.judged && tg.t < now - 1));
}
function rcTick() {
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.value = 350;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.04);
}
rcPad.addEventListener("pointerdown", async (e) => {
  e.preventDefault();
  await ensureAudio();
  rcTick();
  if (!rcOn) return;
  const now = audioCtx.currentTime;
  const lat = outLat();
  let best = null, bestD = 0, bestAbs = 1e9;
  for (const tg of rcTargets) {
    if (tg.judged) continue;
    const d = now - (tg.t + lat);
    const a = Math.abs(d);
    if (a < bestAbs) { bestAbs = a; bestD = d; best = tg; }
  }
  if (best && bestAbs <= 0.110) {
    best.judged = true;
    const ms = Math.round(bestD * 1000);
    rcDevs.push(ms);
    if (rcDevs.length > 16) rcDevs.shift();
    if (bestAbs <= 0.050) { rcGood++; rcFbkSet("良 " + fmtMs(ms)); }
    else { rcOk++; rcFbkSet("可 " + fmtMs(ms)); }
    rcRoll.push(1);
  } else {
    rcMiss++;
    rcRoll.push(0);
    rcFbkSet("ミス");
  }
  trimRoll();
  renderRc();
});
async function rcStart() {
  await ensureAudio();
  acquireWake();
  rcOn = true;
  rcBeat = 0;
  rcBarNum = 0;
  rcMuted = false;
  rcBpmCur = bpm;
  rcTargets = [];
  rcNextBeat = audioCtx.currentTime + 0.1;
  rcTimer = setInterval(rcLoop, 25);
  rcStartBtn.textContent = "ストップ";
  rcStartBtn.classList.add("playing");
  rcFbkSet("カウントイン…");
  renderRcBpm();
}
function rcStop() {
  if (!rcOn && rcTimer === null) return;
  rcOn = false;
  if (rcTimer !== null) { clearInterval(rcTimer); rcTimer = null; }
  rcStartBtn.textContent = "スタート";
  rcStartBtn.classList.remove("playing");
  rcDotEls.forEach(d => d.classList.remove("on"));
  releaseWake();
  renderRcBpm();
}
rcStartBtn.addEventListener("click", () => (rcOn ? rcStop() : rcStart()));
document.getElementById("rcReset").addEventListener("click", () => {
  rcGood = 0; rcOk = 0; rcMiss = 0;
  rcRoll = []; rcDevs = [];
  rcFbkSet("");
  renderRc();
});
rcTgtBtn.addEventListener("click", () => {
  rcTargetBack = !rcTargetBack;
  store.set("gt.rcback", rcTargetBack ? "1" : "0");
  renderRcTgt();
});
document.getElementById("rcTrain").addEventListener("click", () => {
  renderTrain();
  openSheet(trainSheet);
});
holdButton(document.getElementById("rcBpmM"), -1);
holdButton(document.getElementById("rcBpmP"), +1);
renderRcTgt();
renderRc();

/* ================= 練習: 聴音 ================= */
let etSemi = -1, etDeg = 1;
let etCorrect = 0, etTotal = 0, etStreak = 0;
let etLock = false, etAsked = false;
let etBest = parseInt(store.get("gt.etBest", "0"), 10) || 0;

const etStatusEl = document.getElementById("etStatus");
const etFbkEl = document.getElementById("etFbk");
const etGridEl = document.getElementById("etGrid");
const etPlayBtn = document.getElementById("etPlay");

function renderEtStats() {
  const el = document.getElementById("etStats");
  el.innerHTML = "";
  el.appendChild(statCol(etCorrect, "正解"));
  el.appendChild(statCol(etTotal, "出題"));
  el.appendChild(statCol(etStreak, "連続"));
  el.appendChild(statCol(etBest, "ベスト"));
}
function renderEtGrid() {
  etGridEl.innerHTML = "";
  if (curScaleId === "chromatic") return;
  const sc = SCALE_BY_ID[curScaleId];
  sc.iv.filter(v => v[1] !== 1).forEach(v => {
    const b = document.createElement("button");
    b.textContent = degLabel(v[0], v[1]);
    b.addEventListener("click", () => etAnswer(v[0], v[1]));
    etGridEl.appendChild(b);
  });
}
async function etPlayQuestion(newQ) {
  if (curScaleId === "chromatic") return;
  await ensureAudio();
  if (newQ) {
    const sc = SCALE_BY_ID[curScaleId];
    const opts = sc.iv.filter(v => v[1] !== 1);
    if (!opts.length) return;
    let pick = opts[Math.floor(Math.random() * opts.length)];
    if (opts.length > 1 && pick[0] === etSemi) {
      pick = opts[(opts.indexOf(pick) + 1) % opts.length];
    }
    etSemi = pick[0];
    etDeg = pick[1];
    etAsked = true;
    etFbkEl.textContent = "";
    etStatusEl.textContent = "?";
    etPlayBtn.textContent = "もう一度聴く";
    prHintEl.textContent = "";
  }
  const t0 = audioCtx.currentTime + 0.05;
  const rootMidi = 48 + curScaleRoot;
  playPluck(rootMidi, t0, 0.45);
  playPluck(rootMidi + etSemi, t0 + 0.65, 0.45);
}
function etJudge(correct) {
  etTotal++;
  const label = degLabel(etSemi, etDeg) + " (" + spellNote(curScaleRoot, etSemi, etDeg) + ")";
  if (correct) {
    etCorrect++;
    etStreak++;
    if (etStreak > etBest) { etBest = etStreak; store.set("gt.etBest", etBest); }
    etStatusEl.textContent = "○";
    etFbkEl.textContent = "正解 " + label;
  } else {
    etStreak = 0;
    etStatusEl.textContent = "×";
    etFbkEl.textContent = "正解は " + label;
  }
  renderEtStats();
  etLock = true;
  setTimeout(() => { etLock = false; etPlayQuestion(true); }, 1200);
}
function etAnswer(semi, deg) {
  if (etLock || !etAsked || etSemi < 0) return;
  etJudge(semi === etSemi);
}
etPlayBtn.addEventListener("click", () => {
  if (etLock) return;
  if (!etAsked || etSemi < 0) etPlayQuestion(true);
  else etPlayQuestion(false);
});
document.getElementById("etPass").addEventListener("click", () => {
  if (etLock || !etAsked || etSemi < 0) return;
  etJudge(false);
});
document.getElementById("etReset").addEventListener("click", () => {
  etCorrect = 0; etTotal = 0; etStreak = 0;
  etAsked = false; etSemi = -1;
  etStatusEl.textContent = "—";
  etFbkEl.textContent = "";
  etPlayBtn.textContent = "出題";
  renderEtStats();
});

/* ================= 練習: ボーカル ================= */
let voLo = parseInt(store.get("gt.voLo", "45"), 10);
let voHi = parseInt(store.get("gt.voHi", "69"), 10);
if (isNaN(voLo)) voLo = 45;
if (isNaN(voHi)) voHi = 69;
voLo = Math.min(82, Math.max(24, voLo));
voHi = Math.min(84, Math.max(26, voHi));
if (voHi - voLo < 2) voHi = voLo + 2;
let voTargetMidi = -1;
let voAsked = false, voLock = false;
let voCorrect = 0, voTotal = 0, voStreak = 0;
let voBest = parseInt(store.get("gt.voBest", "0"), 10) || 0;
let voDevs = [];
let voGateT = 0;
let voHoldStart = 0, voHoldSum = 0, voHoldN = 0;
let voDeadline = 0;

const voTargetEl = document.getElementById("voTarget");
const voLiveEl = document.getElementById("voLive");
const voFbkEl = document.getElementById("voFbk");
const voDot = document.getElementById("voDot");
const voPlayBtn = document.getElementById("voPlay");

function midiName(m) { return NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
function fmtCt(v) { return (v > 0 ? "+" : "") + v; }
function renderVoRange() {
  document.getElementById("voLoV").textContent = "下限 " + midiName(voLo);
  document.getElementById("voHiV").textContent = "上限 " + midiName(voHi);
}
function voSaveRange() {
  store.set("gt.voLo", voLo);
  store.set("gt.voHi", voHi);
  renderVoRange();
}
document.getElementById("voLoM").addEventListener("click", () => { voLo = Math.max(24, voLo - 1); if (voHi - voLo < 2) voHi = voLo + 2; voSaveRange(); });
document.getElementById("voLoP").addEventListener("click", () => { voLo = Math.min(voHi - 2, voLo + 1); voSaveRange(); });
document.getElementById("voHiM").addEventListener("click", () => { voHi = Math.max(voLo + 2, voHi - 1); voSaveRange(); });
document.getElementById("voHiP").addEventListener("click", () => { voHi = Math.min(84, voHi + 1); voSaveRange(); });

function renderVoStats() {
  const el = document.getElementById("voStats");
  el.innerHTML = "";
  el.appendChild(statCol(voCorrect, "正解"));
  el.appendChild(statCol(voTotal, "出題"));
  el.appendChild(statCol(voStreak, "連続"));
  el.appendChild(statCol(voBest, "ベスト"));
  if (voDevs.length) {
    const avg = Math.round(voDevs.reduce((a, b) => a + b, 0) / voDevs.length);
    el.appendChild(statCol(fmtCt(avg), avg > 8 ? "平均(高め)" : (avg < -8 ? "平均(低め)" : "平均セント")));
  }
}
function voPick() {
  const sc = SCALE_BY_ID[curScaleId];
  const pcs = new Set(sc.iv.map(v => (curScaleRoot + v[0]) % 12));
  const cands = [];
  for (let m = voLo; m <= voHi; m++) if (pcs.has(m % 12)) cands.push(m);
  if (!cands.length) return -1;
  let m = cands[Math.floor(Math.random() * cands.length)];
  if (cands.length > 1 && m === voTargetMidi) {
    m = cands[(cands.indexOf(m) + 1) % cands.length];
  }
  return m;
}
function voPlayTone() {
  const t = audioCtx.currentTime + 0.03;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
  g.gain.setValueAtTime(0.3, t + 0.85);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  g.connect(audioCtx.destination);
  const base = refPitch * Math.pow(2, (voTargetMidi - 69) / 12);
  [[1, 1], [2, 0.45], [3, 0.22]].forEach(p => {
    const o = audioCtx.createOscillator();
    o.type = "sine";
    o.frequency.value = base * p[0];
    const pg = audioCtx.createGain();
    pg.gain.value = p[1];
    o.connect(pg).connect(g);
    o.start(t);
    o.stop(t + 1.05);
  });
  voGateT = t + 1.15;
  voDeadline = performance.now() + (voGateT - audioCtx.currentTime) * 1000 + 6000;
  voHoldStart = 0;
  voHoldSum = 0;
  voHoldN = 0;
}
async function voQuestion(newQ) {
  await ensureAudio();
  if (newQ) {
    const m = voPick();
    if (m < 0) {
      prHintEl.textContent = "音域内に出題できる音がありません(音域かスケールを見直してください)";
      return;
    }
    voTargetMidi = m;
    voAsked = true;
    voFbkEl.textContent = "";
    voTargetEl.textContent = midiName(m);
    voPlayBtn.textContent = "もう一度聴く";
    voLiveEl.textContent = "";
    voDot.style.visibility = "hidden";
    prHintEl.textContent = prMicOn ? "" : "マイクを開始すると判定できます";
  }
  voPlayTone();
}
function voJudge(kind, avg) {
  voTotal++;
  if (kind === "miss" || kind === "pass") {
    voStreak = 0;
    voFbkEl.textContent = kind === "pass" ? "パス" : "ミス(時間切れ)";
  } else {
    voCorrect++;
    voStreak++;
    if (voStreak > voBest) { voBest = voStreak; store.set("gt.voBest", voBest); }
    const c = Math.round(avg);
    voDevs.push(c);
    if (voDevs.length > 16) voDevs.shift();
    voFbkEl.textContent = (kind === "good" ? "良 " : "可 ") + fmtCt(c) + "セント";
  }
  renderVoStats();
  voDot.style.visibility = "hidden";
  voLiveEl.textContent = "";
  voLock = true;
  setTimeout(() => { voLock = false; voQuestion(true); }, 1200);
}
function voFrame(freq) {
  if (!voAsked || voLock || voTargetMidi < 0) {
    voDot.style.visibility = "hidden";
    return;
  }
  if (audioCtx.currentTime < voGateT) {
    voLiveEl.textContent = "…";
    return;
  }
  const nowPerf = performance.now();
  if (freq > 0) {
    const midiF = 69 + 12 * Math.log2(freq / refPitch);
    const cents = (midiF - voTargetMidi) * 100;
    const near = Math.round(midiF);
    voLiveEl.textContent = midiName(near) + " " + fmtCt(Math.round(cents));
    const clamped = Math.max(-100, Math.min(100, cents));
    voDot.style.left = (50 + clamped / 2) + "%";
    voDot.style.visibility = "visible";
    if (Math.abs(cents) <= 70) {
      if (voHoldStart === 0) { voHoldStart = nowPerf; voHoldSum = 0; voHoldN = 0; }
      voHoldSum += cents;
      voHoldN++;
      if (nowPerf - voHoldStart >= 500) {
        const avg = voHoldSum / voHoldN;
        voJudge(Math.abs(avg) <= 30 ? "good" : "ok", avg);
        return;
      }
    } else {
      voHoldStart = 0;
    }
  } else {
    voHoldStart = 0;
    voDot.style.visibility = "hidden";
    voLiveEl.textContent = "";
  }
  if (nowPerf > voDeadline) voJudge("miss", null);
}
voPlayBtn.addEventListener("click", () => {
  if (voLock) return;
  if (!voAsked || voTargetMidi < 0) voQuestion(true);
  else voQuestion(false);
});
document.getElementById("voPass").addEventListener("click", () => {
  if (voLock || !voAsked || voTargetMidi < 0) return;
  voJudge("pass", null);
});
document.getElementById("voReset").addEventListener("click", () => {
  voCorrect = 0; voTotal = 0; voStreak = 0;
  voDevs = [];
  voAsked = false; voTargetMidi = -1;
  voTargetEl.textContent = "—";
  voFbkEl.textContent = "";
  voLiveEl.textContent = "";
  voDot.style.visibility = "hidden";
  voPlayBtn.textContent = "出題";
  renderVoStats();
});

/* ================= 全体 ================= */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (playing) stopMetro();
    if (micOn) stopTuner();
    stopSkPlay();
    stopPrMic();
    rcStop();
    stopAllVoices();
  } else if (liveOpen) {
    acquireWake();
  }
});

setBpm(bpm);
renderDots();
beatBtn.textContent = beatsPerBar + "拍子";
renderSub();
renderTrain();
renderMode();
renderRef();
renderOctRow();
renderHist();
let lastChord = { r: 0, t: "" };
try { lastChord = JSON.parse(store.get("gt.lastChord", '{"r":0,"t":""}')); } catch (e) {}
if (!TYPE_BY_ID[lastChord.t] && lastChord.t !== "") lastChord = { r: 0, t: "" };
curRoot = lastChord.r; curType = lastChord.t;
let lastScale = { r: 0, id: "major" };
try { lastScale = JSON.parse(store.get("gt.lastScale", '{"r":0,"id":"major"}')); } catch (e) {}
if (!SCALE_BY_ID[lastScale.id]) lastScale = { r: 0, id: "major" };
curScaleRoot = lastScale.r; curScaleId = lastScale.id;
setDictMode(dictMode);
renderSkList();
setMemoView("list");
setPrMode(prMode);
showTab(store.get("gt.tab", "metro"));
</script>
